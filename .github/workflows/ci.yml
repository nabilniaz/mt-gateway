name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type-check and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90

  docker:
    name: Build image and smoke-test the stack
    needs: test
    runs-on: ubuntu-24.04  # x86-64, like App Platform's builders
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          python-version: "3.12"
      - run: uv run --no-dev gateway-init-env
      - run: docker compose up --build --detach --wait
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down
